[package]
name = "project-tensho"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.102"
bitflags = "2.12.1"
dioxus = { version = "0.7.9", features = ["router"] }
futures = "0.3.32"
getrandom = { version = "0.4.2", features = ["wasm_js"] }
rand = "0.10.1"
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1.0"
tracing = "0.1.44"
web-sys = { version = "0.3.98", features = [
    "Window",
    "Response",
    "Document",
    "Element",
] }
ocgcore-ffi = { version = "0.1.3", features = ["bundled"] }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
