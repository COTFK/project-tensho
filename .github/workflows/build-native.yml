name: Build native executables

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: native-production
  cancel-in-progress: true

jobs:
  build-native:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: native-build-linux
            cargo_bin: $HOME/.cargo/bin
          - os: windows-latest
            artifact_name: native-build-windows
            cargo_bin: $env:USERPROFILE\\.cargo\\bin

    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            g++ \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libxdo-dev

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --locked

      - name: Add Cargo bin to PATH (Linux)
        if: runner.os == 'Linux'
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Add Cargo bin to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "$env:USERPROFILE\\.cargo\\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Bundle app
        run: dx bundle --platform desktop --release --debug-symbols=false --out-dir bundle

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: bundle/

