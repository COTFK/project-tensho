name: Build native executables

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: native-production
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Dioxus CLI
        run: curl -sSL https://dioxus.dev/install.sh | bash

      - name: Add Cargo bin to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Bundle app
        run: dx bundle --platform desktop --release --debug-symbols=false --out-dir bundle

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-build-linux
          path: bundle/

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --locked

      - name: Add Cargo bin to PATH
        shell: pwsh
        run: |
          "$env:USERPROFILE\\.cargo\\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Bundle app
        run: dx bundle --platform desktop --release --debug-symbols=false --out-dir bundle

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-build-windows
          path: bundle/

